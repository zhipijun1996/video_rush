name: Download finished Video Rush episode
run-name: Deliver ${{ inputs.artifact_name }}
on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: Name of the finished episode download
        required: true
        default: video-rush-ep002
      public_key:
        description: One-time uploader public key (base64 PEM; never a private key)
        required: true
      byte_size:
        description: Verified delivery ZIP size
        required: true
      sha256:
        description: Verified delivery ZIP SHA256
        required: true
permissions:
  contents: read
  actions: read
  checks: write
jobs:
  receive:
    name: Receive verified episode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VR_ARTIFACT_NAME: ${{ inputs.artifact_name }}
      VR_PUBLIC_KEY: ${{ inputs.public_key }}
      VR_BYTE_SIZE: ${{ inputs.byte_size }}
      VR_ZIP_SHA256: ${{ inputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned GitHub Artifact client
        run: npm install --prefix build/artifact-bridge --no-audit --no-fund @actions/artifact@2.3.2
      - name: Receive existing verified delivery ZIP
        uses: actions/github-script@v7
        with:
          script: |
            await require('./tools/receive-artifact.cjs')({github, context, core});
