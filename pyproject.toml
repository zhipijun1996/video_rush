[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-rush"
version = "0.1.0"
description = "Evidence-first Chinese game development video production"
requires-python = ">=3.11"
dependencies = ["Pillow>=10", "edge-tts>=7", "piper-tts>=1.3", "requests>=2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
video-rush = "video_rush.cli:main"

[tool.setuptools.packages.find]
include = ["video_rush*"]

[tool.setuptools.package-data]
video_rush = ["drivers/*.gd"]
